name: Preview Yoka Transporte Spark
on:
  push:
    branches: [feature/transporte-appsscript-spark]
    paths:
      - 'transporte/**'
      - '.github/workflows/yoka-transporte-spark-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testar frontend
        run: cd transporte && npm run check
      - name: Publicar somente o canal de teste do Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
          projectId: yoka-transporte
          channelId: spark-verificado
          expires: 7d
          entryPoint: transporte
          firebaseToolsVersion: '15.33.0'
