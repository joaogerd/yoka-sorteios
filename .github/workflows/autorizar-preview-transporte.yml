name: Autorizar dominio preview Yoka Transporte
on:
  push:
    branches: [feature/transporte-appsscript-spark]
    paths: ['.github/workflows/autorizar-preview-transporte.yml']
permissions:
  contents: read
jobs:
  auth-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar apenas dominio de preview com conta de servico existente
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
        run: |
          node --input-type=module <<'JS'
          import {createSign} from 'node:crypto';
          const project='yoka-transporte';
          const domain='yoka-transporte--spark-verificado-flq3r1mo.web.app';
          if(!process.env.SA_JSON)throw Error('Secret de deploy do Firebase não configurado.');
          const sa=JSON.parse(process.env.SA_JSON);
          if(sa.project_id!==project || !sa.private_key || !sa.client_email)
            throw Error('Credencial não pertence ao projeto do transporte.');
          const b64=value=>Buffer.from(JSON.stringify(value)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const prefix=b64({alg:'RS256',typ:'JWT'})+'.'+b64({
            iss:sa.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',
            aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3000
          });
          const signature=createSign('RSA-SHA256').update(prefix).sign(sa.private_key,'base64url');
          const oauth=await fetch('https://oauth2.googleapis.com/token',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion:prefix+'.'+signature})
          });
          if(!oauth.ok)throw Error('Credencial OAuth rejeitada HTTP '+oauth.status);
          const {access_token}=await oauth.json();
          const endpoint='https://identitytoolkit.googleapis.com/admin/v2/projects/'+project+'/config';
          const headers={'Authorization':'Bearer '+access_token,'Content-Type':'application/json'};
          const current=await fetch(endpoint,{headers});
          if(!current.ok)throw Error('Sem permissão de leitura da configuração Firebase Auth HTTP '+current.status);
          const cfg=await current.json();
          const original=cfg.authorizedDomains;
          if(!Array.isArray(original)||!original.length)throw Error('Lista atual de domínios ausente; não modificar.');
          if(original.includes(domain)){
            console.log('Domínio de preview já autorizado. Nenhuma mudança.');
            process.exit(0);
          }
          const names=[...new Set([...original,domain])];
          const result=await fetch(endpoint+'?updateMask=authorizedDomains',{
            method:'PATCH',headers,body:JSON.stringify({authorizedDomains:names})
          });
          if(!result.ok)throw Error('Não autorizado a alterar Firebase Auth HTTP '+result.status+
            '. É necessário firebaseauth.configs.update.');
          const updated=await result.json();
          if(!updated.authorizedDomains?.includes(domain))throw Error('Inclusão não confirmada.');
          console.log('Domínio de preview habilitado; os demais domínios foram preservados.');
          JS
