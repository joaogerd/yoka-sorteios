name: Testar e publicar Yoka Transporte
on:
  push:
    branches: [transporte]
    paths: ['transporte/**','.github/workflows/yoka-transporte.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testes e sintaxe
        run: cd transporte && npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar regras mescladas no emulador local do Firestore (sem publicar)
        timeout-minutes: 5
        run: |
          cd transporte
          npx --yes firebase-tools@15.33.0 emulators:exec --only firestore --project demo-yoka-transporte --config firebase.emulator.json "node -e 'console.log(\"Regras carregadas no emulador Firestore\")'"
      - name: Confirmar preservação do cadastro legado e proteção do projeto
        run: |
          test -s transporte/public/passageiros/index.html
          test -s transporte/public/passageiros/app.js
          test -s transporte/public/styles-legado.css
          test -s transporte/public/firebase-config.js
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const html=fs.readFileSync('transporte/public/passageiros/index.html','utf8');
          const code=fs.readFileSync('transporte/public/passageiros/app.js','utf8');
          const base=fs.readFileSync('transporte/public/app.js','utf8');
          if(!html.includes('/styles-legado.css')||!html.includes('/passageiros/app.js')||
             !code.includes('passengerInvites')||!code.includes('passengerStatus'))
             throw Error('Cadastro de passageiros legado danificado ou ausente');
          if(!base.includes('/passageiros/?t=')) throw Error('Link de passageiros antigo sem redirecionamento');
          JS
      - name: Inspecionar recursos publicados no site (somente leitura)
        run: node transporte/scripts/probe-live-site.mjs
      - name: Conferir destino exclusivo do Transporte
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('transporte/firebase.json'));
          const projects=JSON.parse(fs.readFileSync('transporte/.firebaserc'));
          if(config.hosting.site!=='yoka-transporte'||config.hosting.public!=='public'||projects.projects.default!=='yoka-transporte')throw Error('Destino Firebase inválido');
          if(config.firestore)throw Error('Não pode publicar regras do Firestore antigo nesta rotina');
          JS
  access-check:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Conferir disponibilidade da credencial sem exibir dados secretos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
        run: |
          node --input-type=module - <<'JS'
          const secret = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!secret) {
            console.log('::notice::PENDENTE: criar o secret FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE para habilitar o deploy.');
          } else {
            const obj = JSON.parse(secret);
            if (obj.project_id !== 'yoka-transporte') throw Error('Credencial pertence a projeto diferente de yoka-transporte.');
            console.log('::notice::Credencial do projeto yoka-transporte cadastrada no GitHub.');
          }
          JS
      - name: Confirmar acesso real e somente leitura ao Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then exit 0; fi
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          chmod 600 "$credentials_file"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          npx --yes firebase-tools@15.33.0 hosting:sites:list --project yoka-transporte --json > /tmp/yoka-hosting-sites.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const output=JSON.parse(fs.readFileSync('/tmp/yoka-hosting-sites.json','utf8'));
          if(output.status === 'error') throw Error('Firebase Hosting negou a consulta do projeto.');
          const result=output.result||output;
          const items=Array.isArray(result)?result:Array.isArray(result.sites)?result.sites:[];
          const matches=items.some(item=>item?.siteId==='yoka-transporte'
            || item?.name?.endsWith('/sites/yoka-transporte')
            || item?.defaultUrl==='https://yoka-transporte.web.app');
          if(!matches){
            const names=items.map(item=>({siteId:item?.siteId||null,name:item?.name||null}));
            console.log('Sites retornados pelo projeto:',JSON.stringify(names));
            throw Error('O site yoka-transporte nao foi listado pela credencial.');
          }
          console.log('::notice::Acesso real de leitura confirmado ao Firebase Hosting yoka-transporte.');
          JS
  deploy:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Conferir credencial do projeto Yoka Transporte
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo '::error::Cadastre a credencial do projeto yoka-transporte no secret FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE'; exit 1; fi
      - name: Publicar somente Hosting do projeto original
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
          projectId: yoka-transporte
          channelId: live
          entryPoint: transporte
          firebaseToolsVersion: '15.33.0'
