name: Testar e publicar Yoka Transporte
on:
  push:
    branches: [transporte]
    paths: ['transporte/**','.github/workflows/yoka-transporte.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Testes e sintaxe
        run: cd transporte && npm run check
      - name: Conferir destino exclusivo do Transporte
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('transporte/firebase.json'));
          const projects=JSON.parse(fs.readFileSync('transporte/.firebaserc'));
          if(config.hosting.site!=='yoka-transporte'||config.hosting.public!=='public'||projects.projects.default!=='yoka-transporte')throw Error('Destino Firebase inválido');
          if(config.firestore)throw Error('Não pode publicar regras do Firestore antigo nesta rotina');
          JS
  deploy:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Conferir credencial do projeto Yoka Transporte
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo '::error::Cadastre a credencial do projeto yoka-transporte no secret FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE'; exit 1; fi
      - name: Publicar somente Hosting do projeto original
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOKA_TRANSPORTE }}
          projectId: yoka-transporte
          channelId: live
          entryPoint: transporte
          firebaseToolsVersion: '15.33.0'
