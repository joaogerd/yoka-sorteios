name: Diagnosticar projeto do Transporte
on:
  push:
    branches: [transporte]
    paths: ['.github/workflows/yoka-transporte-diagnostico.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar somente recursos públicos do Hosting existente
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import re,urllib.request,json
          root="https://yoka-transporte.web.app"
          def fetch(path):
              try:
                  with urllib.request.urlopen(root+path,timeout=15) as res:
                      return res.read(250000).decode('utf-8','replace')
              except Exception as e:return 'ERRO '+str(e)
          config=json.loads(fetch('/__/firebase/init.json'))
          print('FIREBASE', {x:config.get(x) for x in ('projectId','authDomain','appId')})
          html=fetch('/')
          print('ROOT HTML',html[:1300])
          for path in ('/passageiros.html','/passageiros/','/styles.css','/app.js','/firebase.js','/scripts.js'):
              data=fetch(path)
              print('PATH',path,'LENGTH',len(data),'BEGIN',repr(data[:120]))
              if 'javascript' in data[:120].lower() or 'import ' in data or ('app.js' in path):
                  print('REFERENCIAS',list(set(re.findall(r'(?:collection|doc|firebase|db)[^;\n]{0,140}',data,re.I)))[:12])
          PY
